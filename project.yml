name: Kumo

options:
  bundleIdPrefix: app.kumo
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: -O
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -Osize
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: all
      DEPLOYMENT_POSTPROCESSING: YES
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:
  Kumo:
    type: application
    platform: macOS
    sources:
      - path: Kumo
    info:
      path: Kumo/Resources/Info.plist
      properties:
        CFBundleDisplayName: Kumo
        CFBundleName: Kumo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: © 2026 Salise Studio. Free for personal use.
        KumoRepository: $(KUMO_REPOSITORY)
        NSMicrophoneUsageDescription: Kumo records your voice notes and transcribes them on this Mac.
        NSSpeechRecognitionUsageDescription: Kumo transcribes your recordings on device. Audio never leaves this Mac.
    entitlements:
      path: Kumo/Resources/Kumo.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kumo.Kumo
        PRODUCT_NAME: Kumo
        KUMO_REPOSITORY: Darkyyto/studykit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
